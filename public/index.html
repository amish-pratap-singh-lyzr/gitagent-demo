<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>gap-pr-reviewer — test console</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #0b0d12; --panel: #12161f; --border: #232a38; --text: #e6e9ef;
    --muted: #8b93a3; --accent: #6ea8fe; --good: #3fb950; --warn: #d29922; --bad: #f85149;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f5f6f8; --panel: #ffffff; --border: #e1e4ea; --text: #1a1d24; --muted: #626b7a; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column;
  }
  header { padding: 14px 20px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
  form { display: flex; gap: 8px; padding: 12px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  input, textarea, button {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 7px 10px; font-size: 13px; font-family: inherit;
  }
  input#repo { width: 260px; } input#pr { width: 80px; } input#extra { flex: 1; min-width: 180px; }
  button { background: var(--accent); color: #06122b; border: none; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  main { flex: 1; display: flex; overflow: hidden; }
  .col { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .col + .col { border-left: 1px solid var(--border); }
  .col h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 10px; }
  .msg { font-size: 13.5px; line-height: 1.55; white-space: pre-wrap; margin-bottom: 14px; }
  .event { font-size: 12.5px; padding: 6px 10px; border-radius: 6px; margin-bottom: 6px; border-left: 3px solid var(--border); }
  .event.tool_call { border-left-color: var(--accent); background: rgba(110,168,254,0.08); }
  .event.tool_result { border-left-color: var(--good); background: rgba(63,185,80,0.08); }
  .event.subagent { border-left-color: var(--warn); background: rgba(210,153,34,0.10); font-weight: 600; }
  .event.status { color: var(--muted); border-left-color: var(--muted); }
  .event.error { border-left-color: var(--bad); background: rgba(248,81,73,0.10); }
  .event code { background: rgba(127,127,127,0.15); padding: 1px 5px; border-radius: 4px; }
  .tag { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  #postbox { border-top: 1px solid var(--border); padding: 14px 20px; display: none; }
  #postbox textarea { width: 100%; min-height: 100px; margin-bottom: 8px; }
  #postresult { font-size: 12.5px; margin-top: 8px; color: var(--muted); }
  ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<header>
  <h1>gap-pr-reviewer — test console</h1>
  <p>Runs a real <code>claude -p</code> session against the compiled persona, with the read-only github MCP server and security-scanner sub-agent wired in. Nothing here is simulated.</p>
</header>

<form id="form">
  <input id="repo" placeholder="owner/repo" value="amish-pratap-singh-lyzr/gitagent-demo" />
  <input id="pr" placeholder="PR #" type="number" value="1" />
  <input id="extra" placeholder="Optional extra instruction..." />
  <button id="go" type="submit">Start Review</button>
</form>

<main>
  <div class="col">
    <h2>Review</h2>
    <div id="review"></div>
  </div>
  <div class="col">
    <h2>Activity</h2>
    <div id="activity"></div>
  </div>
</main>

<div id="postbox">
  <h2 style="font-size:12px;text-transform:uppercase;color:var(--muted);margin:0 0 8px;">Proposed comment (edit before posting)</h2>
  <textarea id="commentText"></textarea>
  <button id="postBtn">Post to GitHub</button>
  <div id="postresult"></div>
</div>

<script>
const form = document.getElementById('form');
const reviewEl = document.getElementById('review');
const activityEl = document.getElementById('activity');
const goBtn = document.getElementById('go');
const postbox = document.getElementById('postbox');
const commentText = document.getElementById('commentText');
const postBtn = document.getElementById('postBtn');
const postresult = document.getElementById('postresult');

let currentRepo = null, currentPR = null;

function addEvent(cls, html) {
  const div = document.createElement('div');
  div.className = 'event ' + cls;
  div.innerHTML = html;
  activityEl.appendChild(div);
  activityEl.scrollTop = activityEl.scrollHeight;
}

function addText(text) {
  let last = reviewEl.lastElementChild;
  if (!last || !last.classList.contains('msg') || last.dataset.closed) {
    last = document.createElement('div');
    last.className = 'msg';
    reviewEl.appendChild(last);
  }
  last.textContent += text;
  reviewEl.scrollTop = reviewEl.scrollHeight;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const repo = document.getElementById('repo').value.trim();
  const pullNumber = parseInt(document.getElementById('pr').value, 10);
  const message = document.getElementById('extra').value.trim();
  if (!repo || !pullNumber) return;

  currentRepo = repo; currentPR = pullNumber;
  reviewEl.innerHTML = ''; activityEl.innerHTML = ''; postbox.style.display = 'none';
  goBtn.disabled = true; goBtn.textContent = 'Reviewing...';

  const res = await fetch('/api/review', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ repo, pullNumber, message }),
  });

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf('\n\n')) !== -1) {
      const chunk = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      if (!chunk.startsWith('data: ')) continue;
      const ev = JSON.parse(chunk.slice(6));
      handleEvent(ev);
    }
  }
  goBtn.disabled = false; goBtn.textContent = 'Start Review';
});

function handleEvent(ev) {
  if (ev.type === 'status') {
    addEvent('status', ev.message);
  } else if (ev.type === 'subagent_start') {
    addEvent('subagent', `→ delegated to <code>${ev.subagent_type}</code>: ${ev.description || ''}`);
  } else if (ev.type === 'subagent_end') {
    addEvent('subagent', '← sub-agent returned');
  } else if (ev.type === 'tool_call') {
    addEvent('tool_call', `<span class="tag">${ev.agent}</span> called <code>${ev.tool}</code> ${JSON.stringify(ev.input || {}).slice(0, 120)}`);
  } else if (ev.type === 'tool_result') {
    addEvent('tool_result', `<span class="tag">${ev.agent}</span> tool result received`);
  } else if (ev.type === 'text') {
    if (ev.agent === 'gap-pr-reviewer') addText(ev.text);
  } else if (ev.type === 'review_ready') {
    commentText.value = ev.text;
    postbox.style.display = 'block';
  } else if (ev.type === 'error') {
    addEvent('error', ev.message);
  }
}

postBtn.addEventListener('click', async () => {
  postBtn.disabled = true; postBtn.textContent = 'Posting...';
  postresult.textContent = '';
  try {
    const res = await fetch('/api/post-comment', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ repo: currentRepo, pullNumber: currentPR, text: commentText.value }),
    });
    const data = await res.json();
    postresult.textContent = data.ok ? `Posted: ${data.url}` : `Failed: ${data.error}`;
  } catch (e) {
    postresult.textContent = 'Failed: ' + e.message;
  }
  postBtn.disabled = false; postBtn.textContent = 'Post to GitHub';
});
</script>

</body>
</html>
